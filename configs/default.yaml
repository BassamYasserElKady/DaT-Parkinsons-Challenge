# Relative to the project root. This file is documentation/configuration input;
# the current skeleton intentionally does not start training.
manifest: data/sample_manifest.csv
processed_dir: data/processed
predictions_dir: results/predictions
metrics_path: results/multisample_metrics.csv

preprocessing:
  min_qv: 20
  default_tile_size_px: 224
  cp10k: 10000.0
  control_prefixes: [NegControl, Unassigned, BLANK, NegPrb]

splits:
  development_samples: 8
  final_test_samples: 4
  validation_folds: 5
  seed: 42

model:
  hidden_width: 128
  latent_width: 96
  dropout: 0.20
